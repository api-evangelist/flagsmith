note: >-
  Flagsmith publishes first-party clients across thirteen ecosystems, every one of them from the
  github.com/Flagsmith organisation, so `official: true` is a repository-ownership fact rather than a
  judgement. Currency is uneven and the structured `published:` dates make it legible: the JS, PHP,
  Go, Python, Java, .NET, Rust and Elixir clients are current, while the Ruby gem (4.3.0,
  2024-12-06) and the standalone Kotlin (non-Android) client (5.0.2, 2022-08-09) have not shipped a
  release in over a year against an API whose own changelog moves every one to two weeks.
