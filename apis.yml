name: Flagsmith
aid: flagsmith
description: 'Flagsmith is an open-source feature flag, remote configuration and experimentation platform
  built by Bullet Train Ltd. Teams use it to release features safely, run A/B and multivariate tests,
  and segment users without redeploying code, across web, mobile and server-side applications. It ships
  as a hosted cloud service on a global low-latency Edge API, as a private cloud deployment, or self-hosted
  on the customer''s own infrastructure, with the core product open source under BSD-3-Clause. Two public
  API surfaces back it: a non-secret SDK/Flags API for evaluating flags, and a 615-operation Management
  API that does everything the dashboard does. Flagsmith is OpenFeature compatible, publishes first-party
  SDKs for thirteen language ecosystems, and operates a remote MCP server exposing 54 tools to AI agents
  over OAuth.'
