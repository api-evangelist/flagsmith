  note: >-
    The previous Flagsmith MCP server was hosted on Gram. The provider states it is deprecated and
    will be shut down on 30 June 2026; tool names are unchanged and the custom
    Mcp-Flagsmith-Token-Auth header is replaced by standard Authorization/OAuth.
  sunset: '2026-06-30'
maturity: >-
  The provider labels this an early release and solicits feedback at support@flagsmith.com.
