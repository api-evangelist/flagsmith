description: >-
  The entity graph behind the Flagsmith Management API, derived from schema $refs, path nesting and
  integer id-reference fields. Flagsmith's model is a strict containment tree —
  Organisation > Project > Environment — with feature definitions living at the project level and
  feature VALUES living at the environment level. Getting that split right is the whole mental model:
  a Feature is a name, and a FeatureState is what that name evaluates to in one environment, for one
  segment, or for one identity.
identifiers:
  style: integer primary keys, with a UUID alongside on several entities (Segment, Tag, EnvironmentFeatureVersion)
  prefixes: none
  note: >-
    No typed or prefixed ids (no `feat_…`, `env_…`). An agent holding a bare integer cannot tell what
    kind of thing it identifies, so ids must be carried with their type. The exception that matters:
    an Environment is addressed in paths by its API KEY string (`environment_api_key`) on some
    routes and by its integer pk (`environment_pk`) on others — both appear in the MCP tool set, and
    passing the wrong one is the most likely silent failure on this API.
