evaluation_model:
  note: >-
    The precedence an agent needs in order to predict a flag value: an identity override beats a
    segment override, a segment override beats the environment default, and among competing segments
    the one with the highest priority wins. Multivariate features add weighted variant selection
    hashed on the identity, so the same identity gets a stable variant.
  docs: https://docs.flagsmith.com/flagsmith-concepts/platform-architecture
versioning_fork:
  note: >-
    A structural fork in the model, not a detail: environments carry `use_v2_feature_versioning`. When
    false, feature state is edited in place (update_feature_state, update_environment_feature_state).
    When true, feature state is immutable inside an EnvironmentFeatureVersion, and changing a flag
    means create version -> add/update states -> publish. Half the MCP tool descriptions carry this
    caveat explicitly. Read the environment before choosing the path.
