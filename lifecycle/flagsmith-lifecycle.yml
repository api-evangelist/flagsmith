  published: true
  source: https://docs.flagsmith.com/project-and-community/release-notes
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  commitments:
  - Breaking changes announced in advance through the blog and GitHub issues
  - Migration guides provided
  - Backward compatibility maintained where possible
  - Notice given before removing deprecated features
  note: >-
    A stated policy with no quantified notice period and no runtime signal — Flagsmith emits neither
    RFC 8594 `Deprecation` nor `Sunset` response headers, so a client learns about a retirement from
    a blog post rather than from the API. Where a retirement HAS been announced, though, the provider
    has done it properly: the MCP server migration below carries a named predecessor URL, a hard
    date, and an explicit statement that tool names are unchanged.
