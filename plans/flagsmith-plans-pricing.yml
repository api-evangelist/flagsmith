specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: flagsmith
providerId: flagsmith
generated: '2026-09-17'
method: searched
source: https://flagsmith.com/pricing (HTTP 200, fetched 2026-09-17)
created: '2026-05-04'
modified: '2026-09-17'
supersedes: >-
  The 2026-05-04 bulk-sweep scaffold that previously occupied this file, whose tiers and quotas were
  placeholder defaults (a 1,000-request free tier, a 10 req/min rate cap) bearing no relation to what
  Flagsmith publishes. Replaced in full with the provider's own pricing page.
tags:
- Pricing
- Plans
description: >-
  Flagsmith's published plans. Four tiers, three of them self-serve with prices on the page and a
  14-day trial on both paid self-serve tiers; Enterprise is contact-sales. The metered unit is API
  requests per month against four SDK endpoints, and the pricing page states the overage rate
  openly — unusual, and the reason this artifact carries real numbers rather than "contact us".
plan_count: 4
currency: USD
billing_periods:
- monthly
- annual
annual_discount: '>10% (the provider states annual is paid 12 months up front)'
metered_unit:
  name: API requests per month
  definition: >-
    Total API requests across all projects in the organisation in a calendar month. Only four
    endpoints count: /flags, /identities, /traits and /environment-document (the last for
    server-side local-evaluation SDKs). Management API calls do not count.
  source: https://flagsmith.com/pricing
plans:
- id: flagsmith-free
  name: Free
  type: freemium
  price: '0.00'
  currency: USD
  period: month
  self_serve: true
  description: Feature flags for building on your own.
  limits:
  - {name: api_requests, limit: 50000, timeFrame: month}
  - {name: team_members, limit: 1}
  - {name: projects, limit: 1}
  - {name: feature_flags, limit: null, note: Unlimited, fair usage policy applies}
  - {name: environments, limit: null, note: Unlimited}
  - {name: identities_and_segments, limit: null, note: Unlimited, fair usage policy applies}
  includes:
  - API Access
  overage:
    note: >-
      Free plan does not bill overage. Flagsmith stops answering API requests after a 7-day warning
      email; the block clears 30 days after the warning or on upgrade.
- id: flagsmith-start-up
  name: Start-Up
  type: subscription
  price: '40.00'
  price_monthly_billed_monthly: '45.00'
  currency: USD
  period: month
  self_serve: true
  trial: 14 day free trial
  description: Feature flags for small teams.
  limits:
  - {name: api_requests, limit: 1000000, timeFrame: month}
  - {name: team_members, limit: 3}
  - {name: projects, limit: null, note: Unlimited}
  includes:
  - Everything in Free
  - Email technical support
  - Scheduled flags
  - Two-factor authentication (2FA)
  - A/B and multivariate testing
  - Third-party integrations
  overage:
    rate: $7 per 100,000 requests
    note: Additional API calls also quoted from $50 per million per month, decreasing with volume.
- id: flagsmith-scale-up
  name: Scale-Up
  type: subscription
  price: '250.00'
  price_monthly_billed_monthly: '300.00'
  currency: USD
  period: month
  self_serve: true
  trial: 14 day free trial
  description: Feature flags for growing teams.
  limits:
  - {name: api_requests, limit: 5000000, timeFrame: month, note: 5,000,000+}
  - {name: team_members, limit: 5, note: '5 included, up to 20 at $50/member/month (listed as reduced from $60)'}
  includes:
  - Everything in Start-Up
  - SAML/SSO authentication
  - Governance — roles, permissions, change requests, audit logs
  - Priority email and chat technical support
- id: flagsmith-enterprise
  name: Enterprise
  type: contact-sales
  price: null
  currency: USD
  period: month
  self_serve: false
  description: Maximum security and control. Cloud, private cloud, self-hosted or air-gapped.
  limits:
  - {name: api_requests, limit: 5000000, timeFrame: month, note: '5,000,000+, contracted'}
  - {name: team_members, limit: null, note: 20+}
  includes:
  - Everything in Scale-Up
  - Tailored hosting from cloud to air-gapped
  - Priority real-time support via chat, Slack optional
  - 2FA, SAML, Okta, ADFS and LDAP
  - Unlimited audit log history
  - On-boarding and training
  - Enterprise SLA
  roadmap_items:
  - {name: LDAP + SCIM, status: announced-soon}
  - {name: Data-driven releases, status: announced-soon}
  overage:
    rate: contracted
discounts:
- {audience: open source / not-for-profit / charity, note: 'Discounted plan available on request'}
- {audience: annual billing, note: '>10% saving, 12 months paid up front'}
