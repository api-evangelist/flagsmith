domain_standards:
- id: openfeature
  name: OpenFeature
  standard_body: CNCF
  market: feature flagging / experimentation
  conforms: true
  evidence: https://docs.flagsmith.com/integrating-with-flagsmith/openfeature/
  corroboration:
  - https://github.com/Flagsmith/flagsmith-openfeature-swift-provider
  - https://github.com/Flagsmith/flagsmith-openfeature-provider-kotlin
  - https://github.com/Flagsmith/flagsmith-openfeature-provider-python
  - https://repo1.maven.org/maven2/dev/openfeature/contrib/providers/flagsmith/ (0.0.10, 2026-04-15, published by OpenFeature)
  detail: >-
    OpenFeature is the domain standard for this market and Flagsmith conforms at the layer the
    standard actually defines. Note precisely where the conformance lives: OpenFeature standardises
    the SDK-side evaluation API and the provider interface, not a wire format, so the signature is
    first-party provider implementations rather than a shape inside the REST contract — which is why
    nothing matching "OpenFeature" appears in swagger.json and its absence there is not a
    counter-indication. Flagsmith publishes OpenFeature providers for Swift, Kotlin and Python from
    its own GitHub organisation, contributes to the OpenFeature JS and Python SDK repos, and states
    the commitment in its own llms.txt ("OpenFeature compatible, preventing vendor lock-in"). The
    buyer consequence is the one the standard exists for: a team already speaking OpenFeature
    integrates Flagsmith by swapping a provider, with no bespoke connector.
- id: scim2
  name: SCIM 2.0 (RFC 7643 / RFC 7644)
  standard_body: IETF
  market: enterprise identity provisioning
  conforms: true
  evidence: https://docs.flagsmith.com/administration-and-security/access-control/scim
  contract_location: openapi/_original/flagsmith-api-openapi.json#/paths/~1api~1v1~1organisations~1{organisation_pk}~1scim~1
  detail: >-
    Documented SCIM 2.0 API with /Users and /Groups, the `active` attribute for
    deactivate/reactivate, push groups, and filtering and pagination on both list endpoints.
    userName must be the user's email. Explicitly NOT supported: profile sourcing, /Me, /Bulk,
    sorting and ETag concurrency control. Requires an Enterprise licence and an existing SSO
    configuration.
  limits: [no /Me, no /Bulk, no sorting, no ETag concurrency control, no profile sourcing]
