      - percentage_allocation
    PatchedEdgeIdentityUpdate:
      type: object
      properties:
        identity_uuid:
          type: string
          readOnly: true
        identifier:
          type: string
          readOnly: true
          maxLength: 2000
        dashboard_alias:
          type: string
          maxLength: 100
    IdentitySourceIdentityRequest:
      type: object
      properties:
