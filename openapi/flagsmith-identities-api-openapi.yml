components:
  parameters:
    EnvironmentApiKey:
      name: environment_api_key
      in: path
      description: The API key for the environment
      required: true
      schema:
        type: string
    IdentityId:
      name: identity_id
      in: path
      description: The unique identifier for the identity
      required: true
      schema:
        type: integer
    TransientQuery:
      name: transient
      in: query
      description: When set to true, the identity is treated as transient and will not be persisted. The identity will be used for flag evaluation only.
      required: false
      schema:
        type: boolean
    IdentifierQuery:
      name: identifier
      in: query
      description: The unique identifier for the user identity. This is typically a user ID, email, or other unique string that identifies the user in your application.
      required: true
      schema:
        type: string
  schemas:
    PaginatedResponse:
      type: object
      description: A paginated response wrapper containing the results count and navigation links.
      properties:
        count:
          type: integer
          description: The total number of results
        next:
          type: string
          nullable: true
          format: uri
          description: URL to the next page of results
        previous:
          type: string
          nullable: true
          format: uri
          description: URL to the previous page of results
        results:
          type: array
          description: The array of result objects for this page
          items:
            type: object
    Identity:
      type: object
      description: A user identity within an environment, representing an individual user with their associated traits.
      properties:
        id:
          type: integer
          description: The unique identifier for this identity
        identifier:
          type: string
          description: The user-provided identifier for this identity
        environment:
          type: integer
          description: The ID of the environment this identity belongs to
    PatchedIdentity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        identifier:
          type: string
          maxLength: 2000
        environment:
          type: integer
          readOnly: true
    EdgeIdentityUpdate:
      type: object
      properties:
        identity_uuid:
          type: string
          readOnly: true
        identifier:
          type: string
          readOnly: true
          maxLength: 2000
        dashboard_alias:
          type: string
          maxLength: 100
      required:
      - identifier
    FeatureStateSerializerWithIdentity:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: true
        feature_state_value:
          type:
          - string
          - integer
          - number
          - boolean
          - 'null'
          readOnly: true
        multivariate_feature_state_values:
          type: array
          items:
            $ref: '#/components/schemas/MultivariateFeatureStateValue'
        identifier:
          type: string
          description: Can be passed as an alternative to `identity`
        identity:
          $ref: '#/components/schemas/_Identity'
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        live_from:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type:
          - integer
          - 'null'
          readOnly: true
        feature:
          type: integer
        environment:
          type:
          - integer
          - 'null'
        feature_segment:
          type:
          - integer
          - 'null'
        change_request:
          type:
          - integer
          - 'null'
        environment_feature_version:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - feature
      - identity
    NullEnum:
      type: 'null'
    PaginatedEdgeIdentityList:
      type: object
      required:
      - results
      properties:
        last_evaluated_key:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/EdgeIdentity'
    FeatureStateSerializerCreate:
      type: object
      properties:
        feature:
          type: integer
        enabled:
          type: boolean
      required:
      - feature
    EdgeIdentitySourceIdentityRequest:
      type: object
      properties:
        source_identity_uuid:
          type: string
          description: UUID of the source identity to clone feature states from.
      required:
      - source_identity_uuid
    IdentityAllFeatureStatesMVFeatureStateValue:
      type: object
      properties:
        multivariate_feature_option:
          $ref: '#/components/schemas/IdentityAllFeatureStatesMVFeatureOption'
