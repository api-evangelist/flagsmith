          - $ref: '#/components/schemas/NullEnum'
        integer_value:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        string_value:
          type:
          - string
          - 'null'
          maxLength: 2000
        boolean_value:
          type:
          - boolean
          - 'null'
        float_value:
          type:
          - number
          - 'null'
          format: double
