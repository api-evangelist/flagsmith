openapi: 3.2.0
info:
  title: Flagsmith Organisations API
  version: '1.0'
  description: 'Operations tagged Organisations across 2 of this provider''s published API definitions: flagsmith-admin-api-openapi.yml, flagsmith-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.flagsmith.com/api/v1
  description: Flagsmith Production API
tags:
- name: Organisations
  description: Manage organisations within Flagsmith. Organisations are the top-level container for projects, users, and billing.
paths:
  /organisations/:
    get:
      operationId: listOrganisations
      summary: List organisations
      description: Retrieves a list of all organisations the authenticated user has access to. Returns organisation details including name, subscription information, and feature usage.
      tags:
      - Organisations
      responses:
        '200':
          description: Successful response containing a list of organisations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Unauthorized - invalid or missing API token
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.flagsmith.com/api/v1
      description: Flagsmith Production API
  /organisations/{organisation_id}/:
    get:
      operationId: getOrganisation
      summary: Get an organisation
      description: Retrieves the details of a specific organisation by its ID, including the organisation name, subscription plan, and feature usage limits.
      tags:
      - Organisations
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Successful response containing the organisation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '401':
          description: Unauthorized - invalid or missing API token
        '404':
          description: Organisation not found
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.flagsmith.com/api/v1
      description: Flagsmith Production API
  /api/v1/organisations/:
    post:
      operationId: api_v1_organisations_create
      description: Override create method to add new organisation to authenticated user
      tags:
      - Organisations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganisationSerializerFull'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganisationSerializerFull'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganisationSerializerFull'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationSerializerFull'
          description: ''
      summary: Api v1 organisations create
      x-summary-source: derived
