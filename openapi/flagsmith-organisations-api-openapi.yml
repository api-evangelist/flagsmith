components:
  parameters:
    OrganisationId:
      name: organisation_id
      in: path
      description: The unique identifier for the organisation
      required: true
      schema:
        type: integer
  schemas:
    PaginatedResponse:
      type: object
      description: A paginated response wrapper containing the results count and navigation links.
      properties:
        count:
          type: integer
          description: The total number of results
        next:
          type: string
          nullable: true
          format: uri
          description: URL to the next page of results
        previous:
          type: string
          nullable: true
          format: uri
          description: URL to the previous page of results
        results:
          type: array
          description: The array of result objects for this page
          items:
            type: object
    Organisation:
      type: object
      description: An organisation in Flagsmith, the top-level container for projects, users, and billing.
      properties:
        id:
          type: integer
          description: The unique identifier for this organisation
        name:
          type: string
          description: The name of the organisation
        created_date:
          type: string
          format: date-time
          description: When the organisation was created
        webhook_notification_email:
          type: string
          nullable: true
          description: Email address for webhook failure notifications
        num_seats:
          type: integer
          description: Number of available seats in the organisation
        persist_trait_data:
          type: boolean
          description: Whether trait data is persisted for identities
    GroupRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        group:
          type: integer
        role:
          type: integer
          readOnly: true
      required:
      - group
    PatchedMasterAPIKey:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        prefix:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          description: A free-form name for the API key. Need not be unique. 50 characters max.
          maxLength: 50
        revoked:
          type: boolean
          description: If the API key is revoked, clients cannot use it anymore. (This cannot be undone.)
        expiry_date:
          type:
          - string
          - 'null'
          format: date-time
          title: Expires
          description: Once API key expires, clients cannot use it anymore.
        key:
          type: string
          readOnly: true
          description: 'Since we don''t store the api key itself(i.e: we only store the hash) this key will be none for every endpoint apart from create'
        is_admin:
          type: boolean
          default: true
        has_expired:
          type: boolean
          readOnly: true
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    Invite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        date_created:
          type: string
          format: date-time
          readOnly: true
          title: DateCreated
        permission_groups:
          type: array
          items:
            type:
            - integer
            - 'null'
      required:
      - email
    PaginatedRoleProjectPermissionList:
      type: object
      required:
      - count
