          readOnly: true
          description: 'Edge migration status of the project; can be one of: MIGRATION_SCHEDULED, MIGRATION_COMPLETED, MIGRATION_IN_PROGRESS, MIGRATION_NOT_STARTED, NOT_APPLICABLE'
        use_edge_identities:
          type: boolean
          readOnly: true
        prevent_flag_defaults:
          type: boolean
          description: Prevent defaults from being set in all environments when creating a feature.
        enable_realtime_updates:
          type: boolean
          description: Enable this to trigger a realtime(sse) event whenever the value of a flag changes
        only_allow_lower_case_feature_names:
          type: boolean
          description: Used by UI to validate feature names
        feature_name_regex:
          type:
          - string
          - 'null'
          description: Used for validating feature names
          maxLength: 255
        show_edge_identity_overrides_for_feature:
          type: boolean
          readOnly: true
        stale_flags_limit_days:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Number of days without modification in any environment before a flag is considered stale.
        edge_v2_migration_status:
          allOf:
          - $ref: '#/components/schemas/EdgeV2MigrationStatusEnum'
          description: '[Edge V2 migration] Project migration status. Set to `IN_PROGRESS` to trigger migration start.


            * `NOT_STARTED` - Not Started

            * `IN_PROGRESS` - In Progress

            * `COMPLETE` - Complete

            * `INCOMPLETE` - Incomplete (identity overrides skipped)'
        minimum_change_request_approvals:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        enforce_feature_owners:
          type: boolean
          description: Require at least one user or group owner when creating a feature.
        max_segments_allowed:
          type: integer
          readOnly: true
          description: Max segments allowed for this project
        max_features_allowed:
          type: integer
          readOnly: true
          description: Max features allowed for this project
        max_segment_overrides_allowed:
          type: integer
          readOnly: true
          description: Max segments overrides allowed for any (one) environment within this project
        total_features:
          type: integer
          readOnly: true
        total_segments:
          type: integer
          readOnly: true
      required:
      - name
      - organisation
    EnvironmentFeatureVersionPublish:
      type: object
      properties:
        live_from:
          type: string
          format: date-time
    NestedMultivariateFeatureOption:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        type:
          oneOf:
          - $ref: '#/components/schemas/Type975Enum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        integer_value:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: -2147483648
        string_value:
          type:
          - string
          - 'null'
          maxLength: 20000
        boolean_value:
          type:
          - boolean
          - 'null'
        default_percentage_allocation:
          type: number
          format: double
          maximum: 100
          minimum: 0
        key:
          type:
          - string
          - 'null'
          readOnly: true
          description: A stable, human-readable identifier for the variant.
  securitySchemes:
    Cohort_Sync_Key:
      type: http
      scheme: bearer
      description: For cohort sync endpoints called by an external cohort source, such as Amplitude.
    Cohort_Sync_Key__Basic:
      type: http
      scheme: basic
      description: For cohort sync endpoints called by an external cohort source that can only send Basic credentials, such as Mixpanel. The key is the password; the username is ignored.
    Environment_API_Key:
      type: apiKey
      in: header
      name: X-Environment-Key
      description: For SDK endpoints. <a href='https://docs.flagsmith.com/clients/rest#public-api-endpoints'>Find out more</a>.
    Master_API_Key:
      type: apiKey
      in: header
      name: Authorization
      description: For Management API endpoints. <a href='https://docs.flagsmith.com/integrating-with-flagsmith/flagsmith-api-overview/management-api'>Find out more</a>.
    basicAuth:
      type: http
      scheme: basic
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
