openapi: 3.2.0
info:
  title: Flagsmith MCP API
  version: v1
  description: Flagsmith's Core and SDK APIs. Check out Flagsmith documentation.
  contact:
    email: support@flagsmith.com
  license:
    name: BSD License
    identifier: BSD-3-Clause
tags:
- name: MCP
  description: MCP-compatible endpoints.
paths:
  /api/v1/environments/:
    get:
      operationId: list_environments
      description: Lists all environments the user has access to
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
        description: ID of the project to filter by.
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnvironmentSerializerWithMetadataList'
          description: ''
      summary: List environments
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/create-change-request/:
    post:
      operationId: create_environment_feature_change_request
      description: Creates a new change request for feature flag modifications in an environment.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRequestCreate'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestCreate'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowsError'
          description: ''
      summary: Create environment feature change request
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/experiment-metrics/:
    get:
      operationId: list_metrics
      description: (Beta) Lists experiment metrics for an environment. Supports search by name via the q parameter.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search metrics by name.
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMetricList'
          description: ''
      summary: List metrics
      x-summary-source: derived
    post:
      operationId: create_metric
      description: (Beta) Creates a metric with name, description, aggregation type, expected direction, and event definition.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metric'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Metric'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Metric'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
          description: ''
      summary: Create metric
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/experiment-metrics/{id}/:
    get:
      operationId: get_metric
      description: (Beta) Retrieves details of a specific metric, including which experiments use it.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this metric.
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
          description: ''
      summary: Get metric
      x-summary-source: derived
    put:
      operationId: update_metric
      description: (Beta) Updates a metric's properties.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this metric.
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Metric'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Metric'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Metric'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metric'
          description: ''
      summary: Update metric
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/experiments/:
    get:
      operationId: list_experiments
      description: (Beta) Lists experiments for an environment. Supports filtering by status and searching by experiment or feature name.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Search by experiment or feature name.
      - in: query
        name: status
        schema:
          type: string
        description: Filter by experiment status (DRAFT, RUNNING, PAUSED, COMPLETED).
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExperimentListList'
          description: ''
      summary: List experiments
      x-summary-source: derived
    post:
      operationId: create_experiment
      description: (Beta) Creates an experiment for a multivariate feature. Metrics can be attached inline. Only one active experiment per feature is allowed.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Experiment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Experiment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Experiment'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
          description: ''
      summary: Create experiment
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/experiments/{experiment_id}/:
    get:
      operationId: get_experiment
      description: (Beta) Retrieves experiment details including feature configuration, attached metrics, and rollout state.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: experiment_id
        schema:
          type: integer
        description: A unique integer value identifying this experiment.
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentDetail'
          description: ''
      summary: Get experiment
      x-summary-source: derived
    put:
      operationId: update_experiment
      description: (Beta) Updates an experiment's name or its hypothesis.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: experiment_id
        schema:
          type: integer
        description: A unique integer value identifying this experiment.
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Experiment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Experiment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Experiment'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
          description: ''
      summary: Update experiment
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/experiments/{experiment_id}/exposures/:
    get:
      operationId: get_experiment_exposures
      description: (Beta) Retrieves variant exposure counts for an experiment. Returns null if not yet computed.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: experiment_id
        schema:
          type: integer
        description: A unique integer value identifying this experiment.
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
          description: ''
      summary: Get experiment exposures
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/experiments/{experiment_id}/results/:
    get:
      operationId: get_experiment_results
      description: (Beta) Retrieves statistical results for an experiment's metrics. Returns null if not yet computed.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: experiment_id
        schema:
          type: integer
        description: A unique integer value identifying this experiment.
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
          description: ''
      summary: Get experiment results
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/features/{feature_pk}/create-segment-override/:
    post:
      operationId: create_segment_override
      description: 'Creates a segment override for a feature in an environment in a single call, setting both the segment binding and its value. Applies to environments without v2 feature versioning (use_v2_feature_versioning: false).'
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomCreateSegmentOverrideFeatureState'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomCreateSegmentOverrideFeatureState'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomCreateSegmentOverrideFeatureState'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomCreateSegmentOverrideFeatureState'
          description: ''
      summary: Create segment override
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/featurestates/{id}/:
    put:
      operationId: update_environment_feature_state
      description: 'Updates a feature state in an environment, including enabled status and value. Applies to environments without v2 feature versioning (use_v2_feature_versioning: false).'
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature state.
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureStateSerializerBasic'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FeatureStateSerializerBasic'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FeatureStateSerializerBasic'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureStateSerializerBasic'
          description: ''
      summary: Update environment feature state
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/list-change-requests/:
    get:
      operationId: list_environment_change_requests
      description: Retrieves all change requests for an environment.
      parameters:
      - in: query
        name: committed
        schema:
          type:
          - boolean
          - 'null'
        description: Filter on the committed status of a change request.
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: query
        name: feature_id
        schema:
          type: integer
        description: Filter for a particular feature.
      - in: query
        name: live_from_after
        schema:
          type: string
          format: date-time
        description: Filter change requests due to go live after this datetime.
      - in: query
        name: page
        schema:
          type: integer
        description: A page number within the paginated result set.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results to return per page.
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
        description: Fuzzy search across Change Request titles.
      - in: query
        name: segment_id
        schema:
          type: integer
        description: Filter change requests which match a specific segment id.
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequestList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowsError'
          description: ''
      summary: List environment change requests
      x-summary-source: derived
  /api/v1/environments/{environment_pk}/feature-lifecycle-counts/:
    get:
      operationId: get_feature_lifecycle_counts
      description: Retrieves the count of features in each lifecycle stage for the specified environment.
      parameters:
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureLifecycleCounts'
          description: ''
      summary: Get feature lifecycle counts
      x-summary-source: derived
  /api/v1/environments/{environment_pk}/features/{feature_pk}/versions/:
    get:
      operationId: get_environment_feature_versions
      description: 'Retrieves version information for a feature flag in a specific environment. Applies to environments with v2 feature versioning (use_v2_feature_versioning: true).'
      parameters:
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnvironmentFeatureVersionList'
          description: ''
      summary: Get environment feature versions
      x-summary-source: derived
    post:
      operationId: create_environment_feature_version
      description: 'Creates a new version for a feature flag in a specific environment. Applies to environments with v2 feature versioning (use_v2_feature_versioning: true).'
      parameters:
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentFeatureVersionCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvironmentFeatureVersionCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvironmentFeatureVersionCreate'
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentFeatureVersionCreate'
          description: ''
      summary: Create environment feature version
      x-summary-source: derived
  /api/v1/environments/{environment_pk}/features/{feature_pk}/versions/{environment_feature_version_pk}/featurestates/:
    get:
      operationId: get_environment_feature_version_states
      description: 'Retrieves feature state information for a specific version in an environment. Applies to environments with v2 feature versioning (use_v2_feature_versioning: true).'
      parameters:
      - in: path
        name: environment_feature_version_pk
        schema:
          type:
          - string
          - 'null'
          format: uuid
        required: true
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          description: ''
      summary: Get environment feature version states
      x-summary-source: derived
    post:
      operationId: create_environment_feature_version_state
      description: 'Creates a new feature state for a specific version in an environment. Applies to environments with v2 feature versioning (use_v2_feature_versioning: true).'
      parameters:
      - in: path
        name: environment_feature_version_pk
        schema:
          type:
          - string
          - 'null'
          format: uuid
        required: true
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          description: ''
      summary: Create environment feature version state
      x-summary-source: derived
  /api/v1/environments/{environment_pk}/features/{feature_pk}/versions/{environment_feature_version_pk}/featurestates/{id}/:
    put:
      operationId: update_environment_feature_version_state
      description: 'Updates an existing feature state for a specific version in an environment. Applies to environments with v2 feature versioning (use_v2_feature_versioning: true).'
      parameters:
      - in: path
        name: environment_feature_version_pk
        schema:
          type:
          - string
          - 'null'
          format: uuid
        required: true
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature state.
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomEnvironmentFeatureVersionFeatureState'
          description: ''
      summary: Update environment feature version state
      x-summary-source: derived
  /api/v1/environments/{environment_pk}/features/{feature_pk}/versions/{id}/publish/:
    post:
      operationId: publish_environment_feature_version
      description: 'Publishes a feature version to make it live in the environment. Applies to environments with v2 feature versioning (use_v2_feature_versioning: true).'
      parameters:
      - in: path
        name: environment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: feature_pk
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentFeatureVersionPublish'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnvironmentFeatureVersionPublish'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnvironmentFeatureVersionPublish'
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentFeatureVersionPublish'
          description: ''
      summary: Publish environment feature version
      x-summary-source: derived
  /api/v1/features/feature-segments/:
    get:
      operationId: list_feature_segments
      description: Lists segment overrides for a feature in an environment.
      parameters:
      - in: query
        name: environment
        schema:
          type: integer
        required: true
      - in: query
        name: feature
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeatureSegmentListList'
          description: ''
      summary: List feature segments
      x-summary-source: derived
  /api/v1/features/feature-segments/{id}/:
    delete:
      operationId: delete_feature_segment
      description: 'Deletes a segment override. Applies to environments without v2 feature versioning (use_v2_feature_versioning: false).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature segment.
        required: true
      tags:
      - MCP
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '204':
          description: No response body
      summary: Delete feature segment
      x-summary-source: derived
  /api/v1/features/featurestates/{id}/:
    put:
      operationId: update_feature_state
      description: 'Updates a feature state, including its enabled status and value. Also updates a segment override''s value for environments without v2 feature versioning (use_v2_feature_versioning: false).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature state.
        required: true
      tags:
      - MCP
      requestBody:
        content:
          application/json:
