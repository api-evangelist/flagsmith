  /api/v1/projects/{project_pk}/features/:
    get:
      operationId: list_project_features
      description: Lists a project's feature flags (paginated). Pass `environment=` to also get each feature's live state for that environment in `environment_feature_state`, along with override counts. Works for both v1 and v2 versioned environments.
      parameters:
      - in: query
        name: environment
        schema:
          type: integer
        description: Integer ID of the environment to view features in the context of.
      - in: query
        name: group_owners
        schema:
          type: string
          minLength: 1
        description: Comma separated list of group owner ids to filter on
      - in: query
        name: identity
        schema:
          type: string
          minLength: 1
        description: ID of the identity to sort features with identity overrides first.
      - in: query
        name: is_archived
        schema:
          type: boolean
      - in: query
        name: is_enabled
        schema:
          type:
          - boolean
          - 'null'
        description: Boolean value to filter features as enabled or disabled.
      - in: query
        name: lifecycle_stage
        schema:
          enum:
          - new
          - live
          - stale
          - permanent
          - needs_monitoring
          - to_remove
          type: string
          minLength: 1
        description: 'Lifecycle stage to filter on. Requires `environment`.


          * `new` - new

          * `live` - live

          * `stale` - stale

          * `permanent` - permanent

          * `needs_monitoring` - needs_monitoring

          * `to_remove` - to_remove'
      - in: query
        name: owners
        schema:
          type: string
          minLength: 1
        description: Comma separated list of owner ids to filter on
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: project_pk
        schema:
          type: integer
          description: Changing the project selected will remove previous Feature States for the previously associated projects Environments that are related to this Feature. New default Feature States will be created for the new selected projects Environments for this Feature. Also this will remove any Tags associated with a feature as Tags are Project defined
        required: true
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      - in: query
        name: segment
        schema:
          type: integer
        description: Integer ID of the segment to retrieve segment overrides for.
      - in: query
        name: sort_direction
        schema:
          enum:
          - ASC
          - DESC
          type: string
          default: ASC
          minLength: 1
        description: '* `ASC` - ASC

          * `DESC` - DESC'
      - in: query
        name: sort_field
        schema:
          enum:
          - created_date
          - name
          type: string
          default: created_date
          minLength: 1
        description: '* `created_date` - created_date

          * `name` - name'
      - in: query
        name: tag_strategy
        schema:
          enum:
          - UNION
          - INTERSECTION
          type: string
          default: INTERSECTION
          minLength: 1
        description: '* `UNION` - UNION

          * `INTERSECTION` - INTERSECTION'
      - in: query
        name: tags
        schema:
          type: string
          minLength: 1
        description: Comma separated list of tag ids to filter on (AND with INTERSECTION, and OR with UNION via tag_strategy)
      - in: query
        name: type
        schema:
          enum:
          - STANDARD
          - MULTIVARIATE
          type: string
          minLength: 1
        description: 'Feature type to filter on (STANDARD or MULTIVARIATE).


          * `STANDARD` - STANDARD

          * `MULTIVARIATE` - MULTIVARIATE'
      - in: query
        name: value_search
        schema:
          type: string
          minLength: 1
        description: Value of type int, string, or boolean to filter features based on their values
      tags:
      - MCP
      security:
