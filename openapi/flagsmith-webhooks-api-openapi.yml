          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Webhook_2'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook_2'
          description: ''
      summary: Api v1 environments webhooks create
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/webhooks/{id}/:
    put:
      operationId: api_v1_environments_webhooks_update
      description: Manage webhooks for an environment.
      parameters:
      - in: path
        name: environment_api_key
        schema:
          type: string
        required: true
      - in: path
