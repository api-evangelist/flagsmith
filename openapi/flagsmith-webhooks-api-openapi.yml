      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhook_2'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Webhook_2'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Webhook_2'
        required: true
      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook_2'
          description: ''
      summary: Api v1 environments webhooks update
      x-summary-source: derived
    patch:
      operationId: api_v1_environments_webhooks_partial_update
      description: Manage webhooks for an environment.
      parameters:
      - in: path
