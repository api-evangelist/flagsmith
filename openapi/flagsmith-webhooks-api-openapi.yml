components:
  parameters:
    OrganisationId:
      name: organisation_id
      in: path
      description: The unique identifier for the organisation
      required: true
      schema:
        type: integer
    EnvironmentApiKey:
      name: environment_api_key
      in: path
      description: The API key for the environment
      required: true
      schema:
        type: string
  schemas:
    WebhookInput:
      type: object
      description: Input object for creating or updating a webhook
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: The URL to send webhook events to
        enabled:
          type: boolean
          description: Whether the webhook should be enabled
        secret:
          type: string
          description: Optional secret for signing webhook payloads with HMAC-SHA256
    Webhook:
      type: object
      description: A webhook configuration for receiving event notifications from Flagsmith.
      properties:
        id:
          type: integer
          description: The unique identifier for this webhook
        url:
          type: string
          format: uri
          description: The URL to send webhook events to
        enabled:
          type: boolean
          description: Whether the webhook is currently enabled
        created_at:
          type: string
          format: date-time
          description: When the webhook was created
        updated_at:
          type: string
          format: date-time
          description: When the webhook was last updated
        secret:
          type: string
          description: Optional secret used to sign webhook payloads with HMAC-SHA256 for verification
    OrganisationWebhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        enabled:
          type: boolean
        secret:
          type: string
          maxLength: 255
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - url
    MixpanelWebhookError:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
      required:
      - code
      - message
    PatchedOrganisationWebhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        enabled:
          type: boolean
        secret:
          type: string
          maxLength: 255
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
    MixpanelWebhook:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        parameters:
          $ref: '#/components/schemas/MixpanelParameters'
      required:
      - action
      - parameters
    PaginatedOrganisationWebhookList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganisationWebhook'
    TestWebhookSuccessResponse:
      type: object
      properties:
        detail:
          type: string
        status:
          type: integer
          default: 200
      required:
      - detail
    WebhookSyncMembers:
      type: object
      properties:
        identifiers:
          type: array
          items:
            type: string
          description: Identity identifiers, each at most 1024 bytes of UTF-8.
          maxItems: 10000
          minItems: 1
      required:
      - identifiers
    WebhookScopeTypeEnum:
      enum:
      - organisation
      - environment
      type: string
      description: '* `organisation` - organisation

        * `environment` - environment'
    TestWebhookErrorResponse:
      type: object
      properties:
        detail:
          type: string
        status:
          type: integer
        body:
          type:
          - string
          - 'null'
      required:
      - detail
      - status
    MixpanelWebhookFailureResponse:
      type: object
      properties:
        action:
          type:
          - string
          - 'null'
        status:
          type: string
        error:
          $ref: '#/components/schemas/MixpanelWebhookError'
      required:
      - action
      - error
      - status
    PatchedWebhook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        secret:
          type: string
          maxLength: 255
    MixpanelWebhookResponse:
      type: object
      properties:
        action:
          type: string
        status:
          type: string
      required:
      - action
      - status
    MixpanelMember:
      type: object
      properties:
        mixpanel_distinct_id:
          type: string
      required:
      - mixpanel_distinct_id
    TestWebhook:
      type: object
      properties:
        webhook_url:
          type: string
          format: uri
        scope:
          $ref: '#/components/schemas/Scope'
        secret:
          type:
          - string
          - 'null'
      required:
      - scope
      - webhook_url
    Scope:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/WebhookScopeTypeEnum'
      required:
      - type
    ActionEnum:
      enum:
      - members
      - add_members
      - remove_members
      type: string
      description: '* `members` - members

        * `add_members` - add_members

        * `remove_members` - remove_members'
    MixpanelParameters:
      type: object
      properties:
        mixpanel_cohort_id:
          type: string
          maxLength: 255
        mixpanel_cohort_name:
          type: string
          maxLength: 2000
        members:
          type: array
          items:
            $ref: '#/components/schemas/MixpanelMember'
      required:
      - members
      - mixpanel_cohort_id
      - mixpanel_cohort_name
    Webhook_2:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          maxLength: 200
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
