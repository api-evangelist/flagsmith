      security:
      - tokenAuth: []
      - Master API Key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganisationWebhookList'
          description: ''
      summary: Api v1 organisations webhooks list
      x-summary-source: derived
    post:
      operationId: api_v1_organisations_webhooks_create
      parameters:
      - in: path
        name: organisation_pk
        schema:
          type: integer
        required: true
      tags:
