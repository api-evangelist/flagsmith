openapi: 3.2.0
info:
  title: Flagsmith Webhooks API
  version: '1.0'
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: flagsmith-admin-api-openapi.yml, flagsmith-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.flagsmith.com/api/v1
  description: Flagsmith Production API
tags:
- name: Webhooks
  description: Configure webhooks for environments and organisations to receive notifications about flag changes and audit log events.
paths:
  /environments/{environment_api_key}/webhooks/:
    get:
      operationId: listEnvironmentWebhooks
      summary: List environment webhooks
      description: Retrieves a list of all webhooks configured for a specific environment. Environment webhooks receive flag evaluation data for identified users.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/EnvironmentApiKey'
      responses:
        '200':
          description: Successful response containing a list of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized - invalid or missing API token
      security:
      - apiKeyAuth: []
    post:
      operationId: createEnvironmentWebhook
      summary: Create an environment webhook
      description: Creates a new webhook for an environment. The webhook will receive POST requests containing flag evaluation data whenever identities are evaluated.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/EnvironmentApiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized - invalid or missing API token
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.flagsmith.com/api/v1
      description: Flagsmith Production API
  /organisations/{organisation_id}/webhooks/:
    get:
      operationId: listOrganisationWebhooks
      summary: List organisation webhooks
      description: Retrieves a list of all webhooks configured for a specific organisation. Organisation webhooks receive audit log events for changes made across the organisation.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
      responses:
        '200':
          description: Successful response containing a list of webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '401':
          description: Unauthorized - invalid or missing API token
      security:
      - apiKeyAuth: []
    post:
      operationId: createOrganisationWebhook
      summary: Create an organisation webhook
      description: Creates a new webhook for an organisation. The webhook will receive POST requests containing audit log events for changes made across the organisation.
      tags:
      - Webhooks
      parameters:
      - $ref: '#/components/parameters/OrganisationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '201':
          description: Webhook created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized - invalid or missing API token
      security:
      - apiKeyAuth: []
    servers:
    - url: https://api.flagsmith.com/api/v1
      description: Flagsmith Production API
  /api/v1/cb-webhook/:
    post:
      operationId: api_v1_cb_webhook_create
      description: 'Endpoint to handle webhooks from chargebee.


        Payment failure and payment succeeded webhooks are filtered out and processed

        to determine which of our subscriptions are in a dunning state.


        The remaining webhooks are processed if they have subscription data:


        - If subscription is active, check to see if plan has changed and update if so. Always update cancellation date to

        None to ensure that if a subscription is reactivated, it is updated on our end.


        - If subscription is cancelled or not renewing, update subscription on our end to include cancellation date and

        send alert to admin users.'
      tags:
      - Webhooks
      security:
      - basicAuth: []
      responses:
        '200':
          description: No response body
      summary: Api v1 cb webhook create
      x-summary-source: derived
  /api/v1/cohort-sync/mixpanel/webhook/:
    post:
      operationId: api_v1_cohort_sync_mixpanel_webhook_create
      description: Called by Mixpanel every sync cycle with the cohort's full membership (`members`) or the changes since the last sync (`add_members`/`remove_members`).
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MixpanelWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MixpanelWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MixpanelWebhook'
        required: true
      security:
      - Cohort Sync Key: []
      - Cohort Sync Key (Basic): []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MixpanelWebhookResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MixpanelWebhookFailureResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MixpanelWebhookFailureResponse'
          description: ''
      x-flagsmith-minimum-plan: START_UP
      summary: Api v1 cohort sync mixpanel webhook create
      x-summary-source: derived
  /api/v1/cohort-sync/webhook/cohorts/{id}/members/add/:
    post:
      operationId: api_v1_cohort_sync_webhook_cohorts_members_add_create
      description: Add members to a CSV cohort. Accepted deltas are applied to identity data asynchronously. Re-adding a member is a no-op, so retries are safe.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSyncMembers'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookSyncMembers'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebhookSyncMembers'
        required: true
      security:
      - Cohort Sync Key: []
      - Cohort Sync Key (Basic): []
      responses:
        '200':
          description: No response body
      x-flagsmith-minimum-plan: START_UP
      summary: Api v1 cohort sync webhook cohorts members add create
      x-summary-source: derived
  /api/v1/cohort-sync/webhook/cohorts/{id}/members/remove/:
    post:
      operationId: api_v1_cohort_sync_webhook_cohorts_members_remove_create
      description: Remove members from a CSV cohort. Accepted deltas are applied to identity data asynchronously. Removing a non-member is a no-op, so retries are safe.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSyncMembers'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WebhookSyncMembers'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WebhookSyncMembers'
        required: true
      security:
      - Cohort Sync Key: []
      - Cohort Sync Key (Basic): []
      responses:
        '200':
          description: No response body
      x-flagsmith-minimum-plan: START_UP
      summary: Api v1 cohort sync webhook cohorts members remove create
      x-summary-source: derived
  /api/v1/environments/{environment_api_key}/webhooks/:
    get:
      operationId: api_v1_environments_webhooks_list
