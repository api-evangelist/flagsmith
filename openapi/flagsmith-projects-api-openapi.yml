components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      description: The unique identifier for the project
      required: true
      schema:
        type: integer
  schemas:
    Project:
      type: object
      description: A project in Flagsmith, containing environments and feature flag definitions.
      properties:
        id:
          type: integer
          description: The unique identifier for this project
        name:
          type: string
          description: The name of the project
        created_date:
          type: string
          format: date-time
          description: When the project was created
        organisation:
          type: integer
          description: The ID of the organisation this project belongs to
        hide_disabled_flags:
          type: boolean
          description: Whether to hide disabled flags from SDK responses
        enable_realtime_updates:
          type: boolean
          description: Whether real-time flag updates are enabled
    ProjectInput:
      type: object
      description: Input object for creating or updating a project
      required:
      - name
      - organisation
      properties:
        name:
          type: string
          description: The name of the project
          maxLength: 2000
        organisation:
          type: integer
          description: The ID of the organisation to create the project in
    ReleasePipeline:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        project:
          type: integer
          readOnly: true
        description:
          type:
          - string
          - 'null'
        stages_count:
          type: integer
          readOnly: true
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        published_by:
          type:
          - integer
          - 'null'
        features:
          type: array
          items:
            type: integer
          readOnly: true
      required:
      - name
    StageTrigger:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        trigger_type:
          $ref: '#/components/schemas/TriggerTypeEnum'
        trigger_body:
          oneOf:
          - {}
          - type: 'null'
    ProjectChangeRequest:
      type: object
      description: Adds nested create feature
      properties:
        id:
          type: integer
          readOnly: true
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestApproval'
        committed_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        committed_by:
          type:
          - integer
          - 'null'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        description:
          type:
          - string
          - 'null'
        group_assignments:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestGroupAssignment'
        project_id:
          type: integer
          readOnly: true
        segments:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequestSegment'
        title:
          type: string
          maxLength: 500
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type:
          - integer
          - 'null'
      required:
      - segments
      - title
    Conflict:
      type: object
      properties:
        original_cr_id:
          type: integer
        segment_id:
          type: integer
        is_environment_default:
          type: boolean
        published_at:
          type: string
          format: date-time
      required:
      - is_environment_default
      - original_cr_id
      - published_at
      - segment_id
    FeatureExport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        environment_id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/Status6d4Enum'
        created_at:
          type: string
          format: date-time
          readOnly: true
    Segment:
      type: object
      description: Functionality for serializers that need to handle metadata
      properties:
        id:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 2000
        description:
          type:
          - string
          - 'null'
        project:
          type: integer
          readOnly: true
        feature:
          type:
          - integer
          - 'null'
        version_of:
          type:
          - integer
          - 'null'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/SegmentRule'
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/Metadata'
        membership_counts:
          type: array
          items:
            $ref: '#/components/schemas/SegmentMembershipCount'
          readOnly: true
        managed_by:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/ManagedByEnum'
          - $ref: '#/components/schemas/BlankEnum'
        cohort:
          oneOf:
          - $ref: '#/components/schemas/_SegmentCohort'
          - type: 'null'
          readOnly: true
        has_overrides:
          type: boolean
          readOnly: true
          description: Whether any feature override points at this segment, counting overrides that are live now or scheduled to go live.
      required:
      - name
      - rules
    DetailedPermissions:
      type: object
      properties:
        permission_key:
          type: string
        is_directly_granted:
          type: boolean
        derived_from:
          $ref: '#/components/schemas/DerivedFrom'
      required:
      - derived_from
      - is_directly_granted
      - permission_key
    PaginatedPaginatedQueryParamsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/PaginatedQueryParams'
    PaginatedQueryParams:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
    TriggerTypeEnum:
      enum:
      - ON_ENTER
      - WAIT_FOR
      type: string
      description: '* `ON_ENTER` - Trigger when flag enters stage

        * `WAIT_FOR` - Trigger after waiting for x amount of time'
    PatchedTag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 100
        color:
          type: string
          description: Hexadecimal value of the tag color
          maxLength: 10
        description:
          type:
          - string
          - 'null'
          maxLength: 512
        project:
          type: integer
          readOnly: true
        uuid:
          type: string
          format: uuid
          readOnly: true
        is_permanent:
          type: boolean
          description: When applied to a feature, it means this feature should be excluded from stale flags logic.
        is_system_tag:
          type: boolean
          readOnly: true
          default: false
          description: Indicates that a tag was created by the system, not the user.
        type:
          allOf:
          - $ref: '#/components/schemas/TagTypeEnum'
          readOnly: true
          default: NONE
          description: 'Field used to provide a consistent identifier for the FE and API to use for business logic.


            * `NONE` - None

            * `STALE` - Stale

            * `GITHUB` - Github

            * `UNHEALTHY` - Unhealthy

            * `GITLAB` - Gitlab'
    Tag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          maxLength: 100
        color:
          type: string
          description: Hexadecimal value of the tag color
