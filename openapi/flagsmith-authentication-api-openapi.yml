components:
  schemas:
    SamlConfiguration:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        organisation:
          type: integer
        name:
          type: string
          description: An alphanumeric string to uniquely identify the saml configuration.
          pattern: ^[A-Za-z0-9-]
          maxLength: 100
        frontend_url:
          type: string
          format: uri
          description: Base URL to redirect to on a successful SAML authentication, e.g. https://app.flagsmith.com/
          maxLength: 200
        idp_metadata_xml:
          type:
          - string
          - 'null'
        allow_idp_initiated:
          type: boolean
          title: Allow IdP-initiated (unsolicited) login
      required:
      - frontend_url
      - name
      - organisation
    SignUpTypeEnum:
      enum:
      - NO_INVITE
      - INVITE_EMAIL
      - INVITE_LINK
      type: string
      description: '* `NO_INVITE` - No Invite

        * `INVITE_EMAIL` - Invite Email

        * `INVITE_LINK` - Invite Link'
    NullEnum:
      type: 'null'
    DjangoAttributeNameEnum:
      enum:
      - email
      - first_name
      - last_name
      - groups
      type: string
      description: '* `email` - Email

        * `first_name` - First / Given name

        * `last_name` - Last name / Surname

        * `groups` - Groups'
    SetPasswordRetype:
      type: object
      properties:
        new_password:
          type: string
        re_new_password:
          type: string
        current_password:
          type: string
      required:
      - current_password
      - new_password
      - re_new_password
    Role:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type:
          - string
          - 'null'
        organisation:
          type: integer
          readOnly: true
        tags:
          type: array
          items:
            type: integer
      required:
      - name
    PatchedSamlCurrentUser:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        sign_up_type:
          oneOf:
          - $ref: '#/components/schemas/SignUpTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        auth_type:
          type: string
          readOnly: true
        is_superuser:
          type: boolean
          readOnly: true
        date_joined:
          type: string
          format: date-time
        uuid:
          type: string
          format: uuid
          readOnly: true
        pylon_email_signature:
          type: string
          readOnly: true
    PaginatedRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    CustomUserCreate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        sign_up_type:
          oneOf:
          - $ref: '#/components/schemas/SignUpTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        email:
          type: string
          format: email
          maxLength: 254
        id:
          type: integer
          readOnly: true
        password:
          type: string
          writeOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        marketing_consent_given:
          type: boolean
          readOnly: true
          description: Determines whether the user has agreed to receive marketing mails
        uuid:
          type: string
          format: uuid
          readOnly: true
        key:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - last_name
      - password
    GoogleLogin:
      type: object
      properties:
        access_token:
          type: string
          description: Code or access token returned from the FE interaction with the third party login provider.
        sign_up_type:
          writeOnly: true
          description: 'Provide information about how the user signed up (i.e. via invite or not)


            * `NO_INVITE` - No Invite

            * `INVITE_EMAIL` - Invite Email

            * `INVITE_LINK` - Invite Link'
          oneOf:
          - $ref: '#/components/schemas/SignUpTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        hubspot_cookie:
          type:
          - string
          - 'null'
        marketing_consent_given:
          type:
          - boolean
          - 'null'
        utm_data:
          oneOf:
          - $ref: '#/components/schemas/UTMData'
          - type: 'null'
      required:
      - access_token
    SamlUserToken:
      type: object
      properties:
        key:
          type: string
          maxLength: 40
      required:
      - key
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    PaginatedUserRoleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
    TokenExchangeRequest:
      type: object
      properties:
        token:
          type: string
          description: An OIDC token issued by a trusted identity provider, e.g. a GitHub Actions job token.
      required:
      - token
    UserOrganisation:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
        organisation:
          allOf:
          - $ref: '#/components/schemas/OrganisationSerializerBasic'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          description: Inactive members can still log in, but cannot access the organisation, and do not count towards its seat limit.
      required:
      - role
    SendEmailReset:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    UTMData:
      type: object
      properties:
        utm_source:
