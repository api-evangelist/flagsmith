has_test_mode: false
description: >-
  Flagsmith publishes no test-mode sandbox in the payments sense — there are no test-vs-live key
  prefixes, no test fixtures, no time simulation, and no separate sandbox host. That is a reasonable
  design for a feature-flag platform: the product's own primitive IS the safe place to try things,
  because an environment (Development, Staging, Production) is free and unlimited on every plan
  including Free, and flags evaluated in a dev environment cannot reach production traffic.
